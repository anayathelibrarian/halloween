<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloween</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#17121f;--card:#221a2e;--line:#382d49;--tx:#f1ebf7;--mu:#a79bb8;--ac:#ff7a1a;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:720px;margin:0 auto;padding:40px 20px 80px}
h1,h2{font-family:"Bricolage Grotesque",Georgia,serif;line-height:1.15;margin:0}
h1{font-size:clamp(2.4rem,7vw,4rem);font-weight:800;color:var(--ac);letter-spacing:-.02em}
h2{font-size:1.4rem;font-weight:800}
.back{display:inline-block;margin-bottom:20px;color:var(--mu)}
.back:hover{color:var(--tx)}
.sub{color:var(--mu);margin:8px 0 32px}
.item{display:block;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px 24px;color:inherit;text-decoration:none}
.item:hover{border-color:var(--ac)}
.item p{margin:6px 0 0;color:var(--mu)}
a:focus-visible{outline:3px solid #fff;outline-offset:2px}
</style>
</head>
<body>
<main>
<a class="back" href="https://anayathelibrarian.github.io/">Stitches, Stories, and Spreadsheets</a>
<h1>Halloween</h1>
<p class="sub">What shows up at our door every October 31st.</p>
<a class="item" href="census/">
<h2>Halloween Census: Westside Drive</h2>
<p>Every trick or treater’s costume, counted from 2022 through 2026.</p>
</a>
<a class="item" href="costumes/" style="margin-top:14px">
<h2>Halloween Costume Photos</h2>
<p>Our own costumes, from 2015 to 2026.</p>
</a>
</main>
</body>
</html>
