<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Halloween Census: Westside Drive</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@500;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#17121f;--card:#221a2e;--line:#382d49;--tx:#f1ebf7;--mu:#a79bb8;--ac:#ff7a1a;color-scheme:dark;
--hd:"Bricolage Grotesque",Georgia,serif;--bd:system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.6 var(--bd)}
main{max-width:920px;margin:0 auto;padding:40px 20px 80px}
h1,h2,h3{font-family:var(--hd);line-height:1.15;margin:0}
h1{font-size:clamp(2.2rem,6vw,3.6rem);font-weight:800;color:var(--ac);letter-spacing:-.02em}
h2{font-size:1.7rem;font-weight:800;margin:48px 0 12px}
h3{font-size:1.15rem;font-weight:500;margin:28px 0 8px;color:var(--mu)}
.back{display:inline-block;margin-bottom:20px;color:var(--mu)}
.back a{color:var(--mu)}
.back a:hover{color:var(--tx)}
.sub{color:var(--mu);margin:8px 0 28px;max-width:60ch}
.tabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.tabs button{font:500 1rem var(--bd);color:var(--tx);background:var(--card);border:1px solid var(--line);border-radius:8px;padding:8px 18px;cursor:pointer}
.tabs button[aria-selected=true]{background:var(--ac);color:#1a0f05;border-color:var(--ac);font-weight:700}
button:focus-visible,summary:focus-visible{outline:3px solid #fff;outline-offset:2px}
p{max-width:68ch}
.chart{display:flex;flex-wrap:wrap;gap:28px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:24px}
.chart{justify-content:center}
.chart svg{width:min(340px,100%);height:auto;flex:none}
.leg{list-style:none;margin:0;padding:0;flex:1;min-width:240px}
.leg li{display:flex;align-items:center;gap:10px;padding:4px 0;border-bottom:1px solid var(--line)}
.leg i{width:12px;height:12px;border-radius:3px;flex:none}
.leg b{margin-left:auto;font-variant-numeric:tabular-nums}
.leg small{color:var(--mu);min-width:92px;text-align:right}
details{border-bottom:1px solid var(--line)}
summary{cursor:pointer;padding:12px 0;font-weight:500;display:flex;gap:10px;align-items:center;list-style:none}
summary::-webkit-details-marker{display:none}
summary::before{content:"";flex:none;width:8px;height:8px;margin:0 6px 3px 2px;border-right:2px solid var(--mu);border-bottom:2px solid var(--mu);transform:rotate(-45deg);transition:transform .15s}
details[open]>summary::before{transform:rotate(45deg)}
summary:hover{color:var(--ac)}
@media (prefers-reduced-motion:reduce){summary::before{transition:none}}
.g td{font-weight:700;background:rgba(255,255,255,.05)}
.v td:first-child{padding-left:28px;color:var(--mu)}
.tag{display:inline-block;margin-left:8px;padding:0 8px;border:1px solid currentColor;border-radius:99px;font-size:.72rem;line-height:1.5;white-space:nowrap}
.t-Inflatable{color:#4fc3d9}.t-Bedazzled{color:#e8618c}.t-RealPerson{color:#f2c14e}
summary span{margin-left:auto;color:var(--mu);font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}
.fr td+td,.fr th+th{text-align:right;font-variant-numeric:tabular-nums}
.fr td:first-child{min-width:150px}
table{border-collapse:collapse;width:100%;margin:0 0 16px;font-size:.95rem}
th,td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mu);font-weight:500}
td:last-child,th:last-child{text-align:right;font-variant-numeric:tabular-nums}
.bars{display:grid;gap:10px;margin:16px 0}
.row{display:grid;grid-template-columns:48px 1fr;gap:10px;align-items:center}
.bar{display:flex;height:34px;border-radius:6px;overflow:hidden}
.bar div{font-size:.75rem;color:#120c1a;display:flex;align-items:center;justify-content:center;font-weight:700;overflow:hidden}
.keys{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:.85rem;color:var(--mu);margin-bottom:8px}
.keys i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px}
.err{background:#4a1d2a;padding:16px;border-radius:8px}
.note{color:var(--mu);font-size:.9rem}
footer{margin-top:60px;color:var(--mu)}
</style>
</head>
<body>
<main>
<nav class="back"><a href="../">Halloween</a> · <a href="https://anayathelibrarian.github.io/">Stitches, Stories, and Spreadsheets</a></nav>
<h1>Halloween Census: Westside Drive</h1>
<p class="sub">Every trick or treater’s costume at our door, counted since 2022.</p>
<div class="tabs" id="tabs" role="tablist" aria-label="Year"></div>
<section id="year" aria-live="polite"></section>
<section id="trends"></section>
<footer>Happy Halloween!</footer>
</main>
<script>
const CATS=['Movie / Show','Critter','Profession','SuperMythical','Video Game','Food','Popculture','Mundane','Other'];
const COL=['#ff7a1a','#f2c14e','#7bc96f','#9b7cf0','#4fc3d9','#e8618c','#3f8ef0','#b0a7bf','#6b6179'];
const col=c=>COL[CATS.indexOf(c)];
let rows=[],years=[];
const e=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const cat=r=>CATS.includes(r.category)?r.category:'Other';
const tally=(a,f)=>{const m=new Map();a.forEach(r=>{const k=f(r);if(!k)return;const key=k.trim().toLowerCase();const o=m.get(key)||{name:k.trim(),n:0};o.n++;m.set(key,o)});return[...m.values()].sort((x,y)=>y.n-x.n||x.name.localeCompare(y.name))};
const pct=(n,t)=>t?Math.round(n/t*100):0;

fetch('data.json').then(r=>r.json()).then(j=>{
  rows=j.rows.map(r=>Object.fromEntries(j.cols.map((c,i)=>[c,r[i]])));
  years=[...new Set(rows.map(r=>r.year))].sort();
  const want=+location.hash.slice(1);
  const start=years.includes(want)?want:years[years.length-1];
  const t=document.getElementById('tabs');
  t.innerHTML=[...years].reverse().map(y=>`<button role="tab" data-y="${y}">${y}</button>`).join('');
  t.onclick=ev=>{const y=+ev.target.dataset.y;if(y){location.hash=y;show(y)}};
  show(start);trends();
}).catch(()=>{document.getElementById('year').innerHTML='<p class="err">Could not load data.json. If you opened this file directly from your computer, serve the folder instead (for example, run “python3 -m http.server” and open localhost:8000).</p>'});

function stats(y){
  const all=rows.filter(r=>r.year===y),hum=all.filter(r=>r.wearer==='Human'),dog=all.filter(r=>r.wearer==='Dog');
  const byCat={};CATS.forEach(c=>byCat[c]=hum.filter(r=>cat(r)===c));
  return{all,hum,dog,byCat,uniq:new Set(all.map(r=>r.costume)).size};
}
function donut(parts,total,lab='Costume categories worn by humans'){
  const R=60,C=2*Math.PI*R;let off=0;
  const segs=parts.map(p=>{const l=p.n/total*C,s=`<circle r="${R}" cx="100" cy="100" fill="none" stroke="${col(p.c)}" stroke-width="40" stroke-dasharray="${l} ${C-l}" stroke-dashoffset="${-off}" transform="rotate(-90 100 100)"/>`;off+=l;return s}).join('');
  return`<svg viewBox="0 0 200 200" role="img" aria-label="${lab}">${segs}<text x="100" y="106" text-anchor="middle" fill="#f1ebf7" font-family="Bricolage Grotesque,serif" font-weight="800" font-size="26">${total}</text></svg>`;
}
const list=a=>a.length<2?(a[0]||''):a.slice(0,-1).join(', ')+(a.length>2?',':'')+' and '+a.at(-1);
const agg=l=>{const m=new Map();l.forEach(r=>{const k=[r.costume,r.category2,r.profession,r.franchise,r.category,r.pizazz].map(v=>(v||'').trim().toLowerCase()).join('|');const o=m.get(k)||{r,n:0};o.n++;m.set(k,o)});return[...m.values()]};
const bkey=r=>(r.base||String(r.costume).split(',')[0]).trim();
const vlab=(r,b)=>{const c=r.costume.trim();if(c.toLowerCase()===b.toLowerCase())return'Plain';return !r.base&&c.includes(',')?c.slice(c.indexOf(',')+1).trim():c};
const groups=l=>{const m=new Map();agg(l).forEach(a=>{const b=bkey(a.r),k=b.toLowerCase();const o=m.get(k)||{b,n:0,items:[]};o.n+=a.n;o.items.push(a);m.set(k,o)});m.forEach(g=>{g.items.sort((x,y)=>y.n-x.n||x.r.costume.localeCompare(y.r.costume));g.v=new Set(g.items.map(a=>a.r.costume.trim().toLowerCase())).size>1});return[...m.values()].sort((x,y)=>y.n-x.n||x.b.localeCompare(y.b))};
const tag=k=>k?`<span class="tag t-${k.replace(' ','')}">${k}</span>`:'';
const legend=(parts,total,prev,y,withN)=>`<ul class="leg">${parts.map(x=>`<li><i style="background:${col(x.c)}"></i>${x.c}<small>${prev&&prev.length?prev.filter(r=>cat(r)===x.c).length+' in '+(y-1):''}</small><b>${withN?x.n+' · ':''}${pct(x.n,total)}%</b></li>`).join('')}</ul>`;
function show(y){
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-selected',+b.dataset.y===y));
  const s=stats(y),p=years.includes(y-1)?stats(y-1):null,top=tally(s.all,bkey)[0];
  const parts=CATS.map(c=>({c,n:s.byCat[c].length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
  const cnt=k=>s.all.filter(r=>r.pizazz===k).length,infl=cnt('Inflatable'),bed=cnt('Bedazzled'),real=cnt('Real Person');
  const ex=[[infl,'inflatable'],[bed,'bedazzled'],[real,'based on real people']].filter(x=>x[0]).map((x,i)=>i?`${x[0]} ${x[1]}`:`${x[0]} ${x[0]>1?'were':'was'} ${x[1]}`);
  let h=`<h2>${y}</h2><p>We had ${s.all.length} trick or treaters wearing ${s.uniq} unique costumes. The most popular costume was ${e(top.name.toLowerCase())}, with ${top.n} trick or treaters.${ex.length?` Of the costumes, ${list(ex)}.`:''}</p>`;
  h+=`<h3>Human trick or treaters by category</h3><p>${s.hum.length} of ${s.all.length} trick or treaters were humans, including children and adults.</p>`;
  h+=`<div class="chart">${donut(parts,s.hum.length)}${legend(parts,s.hum.length)}</div><p class="note" style="margin:24px 0 4px">Select a category to see every costume in it.</p><div>`;
  parts.forEach(x=>{
    const d=p?pct(x.n,s.hum.length)-pct(p.byCat[x.c].length,p.hum.length):0;
    const ch=p?(d?`${d>0?'up':'down'} ${Math.abs(d)} pt${Math.abs(d)>1?'s':''} vs ${y-1}`:`same as ${y-1}`):'';
    let body;
    if(x.c==='Movie / Show'){
      body=`<tr><th>Movie, show or franchise</th><th>Costumes</th><th>Count</th></tr>`+tally(s.byCat[x.c],r=>r.franchise||r.costume).map(f=>{
        const inner=agg(s.byCat[x.c].filter(r=>(r.franchise||r.costume).trim().toLowerCase()===f.name.toLowerCase())).sort((a,b)=>b.n-a.n||a.r.costume.localeCompare(b.r.costume));
        return`<tr><td>${e(f.name)}</td><td>${inner.map(({r,n})=>e(r.costume)+(n>1?` (${n})`:'')+tag(r.pizazz)).join('<br>')}</td><td>${f.n}</td></tr>`}).join('');
    }else{
      const oth=x.c==='Other',G=groups(s.byCat[x.c]),l2=G.flatMap(g=>g.items);
      const hf=l2.some(({r})=>r.franchise),hs=l2.some(({r})=>r.category2||r.profession),nb=(oth?1:0)+(hs?1:0)+(hf?1:0);
      const rw=({r,n},lab)=>`<tr${lab!=null?' class="v"':''}><td>${e(lab??r.costume)}${tag(r.pizazz)}</td>${oth?`<td>${e(r.category)}</td>`:''}${hs?`<td>${e([r.category2,r.profession].filter(Boolean).join(', '))}</td>`:''}${hf?`<td>${e(r.franchise)}</td>`:''}<td>${n}</td></tr>`;
      body=`<tr><th>Costume</th>${oth?'<th>Category</th>':''}${hs?'<th>Subcategories</th>':''}${hf?'<th>Media property</th>':''}<th>Count</th></tr>`+G.map(g=>g.v?`<tr class="g"><td>${e(g.b)}</td>${'<td></td>'.repeat(nb)}<td>${g.n}</td></tr>`+g.items.map(a=>rw(a,vlab(a.r,g.b))).join(''):g.items.map(a=>rw(a)).join('')).join('');
    }
    h+=`<details><summary><i style="width:12px;height:12px;border-radius:3px;background:${col(x.c)}"></i>${x.c}<span>${x.n}${ch?' · '+ch:''}</span></summary><div class="tw"><table>${body}</table></div></details>`;
  });
  h+=`</div>`;
  if(s.dog.length){
    const dp=CATS.map(c=>({c,n:s.dog.filter(r=>cat(r)===c).length})).filter(x=>x.n).sort((a,b)=>b.n-a.n);
    h+=`<h3>Dog trick or treaters by category</h3><p>${s.dog.length} of ${s.all.length} trick or treaters were dogs.</p><div class="chart">${donut(dp,s.dog.length,'Costume categories worn by dogs')}${legend(dp,s.dog.length,p&&p.dog,y,true)}</div><div class="tw" style="margin-top:16px"><table><tr><th>Category</th><th>Costume</th><th>Count</th></tr>${agg(s.dog).map(({r,n})=>`<tr><td>${e(r.category)}</td><td>${e(r.costume)}${tag(r.pizazz)}</td><td>${n}</td></tr>`).join('')}</table></div>`;
  }
  document.getElementById('year').innerHTML=h;
}
function dogBars(S){
  const D=S.filter(s=>s.dog.length);if(!D.length)return'';
  const used=CATS.filter(c=>D.some(s=>s.dog.some(r=>cat(r)===c)));
  return`<h3>Dog costumes by category over time</h3><div class="keys">${used.map(c=>`<span><i style="background:${col(c)}"></i>${c}</span>`).join('')}</div><div class="bars">${D.map(s=>`<div class="row"><b>${s.y}</b><div class="bar">${used.map(c=>{const n=s.dog.filter(r=>cat(r)===c).length;return n?`<div style="flex:${n};background:${col(c)}" title="${c}: ${n}">${n}</div>`:''}).join('')}</div></div>`).join('')}</div><p class="note">Numbers show how many dogs wore each category. Each year has only a few dogs, so the shares swing a lot.</p>`;
}
function franchises(){
  const m=new Map();
  rows.forEach(r=>{if(!r.franchise)return;const k=r.franchise.trim().toLowerCase();const o=m.get(k)||{name:r.franchise.trim(),n:0,c:new Map()};o.n++;const ck=r.costume.trim().toLowerCase();const c=o.c.get(ck)||{name:r.costume.trim(),n:0,by:{}};c.n++;c.by[r.year]=(c.by[r.year]||0)+1;o.c.set(ck,c);m.set(k,o)});
  const F=[...m.values()].filter(f=>f.n>3).sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
  const nm=n=>n.replace(/^(.*), (The|A)$/,'$2 $1');
  const cell=v=>v||'–';
  return`<h3>Franchises over time</h3><p class="note">Franchises with more than 3 costumes across all years. Select one to see each costume and how many of them we saw each year.</p>`+F.map(f=>{
    const cs=[...f.c.values()].sort((a,b)=>b.n-a.n||a.name.localeCompare(b.name));
    const tot=y=>cs.reduce((t,c)=>t+(c.by[y]||0),0);
    return`<details><summary>${e(nm(f.name))}<span>${f.n} total</span></summary><div class="tw"><table class="fr"><tr><th>Costume</th>${years.map(y=>`<th>${y}</th>`).join('')}<th>Total</th></tr>${cs.map(c=>`<tr><td>${e(c.name)}</td>${years.map(y=>`<td>${cell(c.by[y])}</td>`).join('')}<td>${c.n}</td></tr>`).join('')}<tr><th>All ${e(nm(f.name))} costumes</th>${years.map(y=>`<th>${cell(tot(y))}</th>`).join('')}<th>${f.n}</th></tr></table></div></details>`}).join('');
}
function trends(){
  const S=years.map(y=>({y,...stats(y)}));
  let h=`<h2>Trends, ${years[0]}–${years[years.length-1]}</h2><h3>Share of human costumes by category</h3><div class="keys">${CATS.map(c=>`<span><i style="background:${col(c)}"></i>${c}</span>`).join('')}</div><div class="bars">`;
  S.forEach(s=>{h+=`<div class="row"><b>${s.y}</b><div class="bar">${CATS.map(c=>{const n=s.byCat[c].length,q=pct(n,s.hum.length);return n?`<div style="flex:${n};background:${col(c)}" title="${c}: ${n} (${q}%)">${q>=6?q+'%':''}</div>`:''}).join('')}</div></div>`});
  h+=`</div>${dogBars(S)}<h3>Year by year</h3><div class="tw"><table><tr><th>Year</th><th>Trick or treaters</th><th>Unique costumes</th><th>Most popular costume</th><th>Count</th></tr>`;
  S.forEach(s=>{const t=tally(s.all,bkey)[0];h+=`<tr><td>${s.y}</td><td>${s.all.length}</td><td>${s.uniq}</td><td>${e(t.name)}</td><td>${t.n}</td></tr>`});
  h+=`</table></div>`;
  const fr=tally(rows.filter(r=>cat(r)==='Movie / Show'),r=>r.franchise||r.costume).slice(0,10);
  const co=tally(rows,bkey).slice(0,10);
  h+=`<h3>All-time favorites</h3><div class="tw"><table><tr><th>Costume</th><th>Total</th></tr>${co.map(c=>`<tr><td>${e(c.name)}</td><td>${c.n}</td></tr>`).join('')}</table></div>`;
  h+=`<div class="tw"><table><tr><th>Movie, show or franchise</th><th>Total</th></tr>${fr.map(c=>`<tr><td>${e(c.name)}</td><td>${c.n}</td></tr>`).join('')}</table></div>`;
  h+=franchises();document.getElementById('trends').innerHTML=h;
}
</script>
</body>
</html>
